<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HackerNews</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

ul {
  list-style-type: none;
}

ol {
    -moz-column-count: 2;
    -moz-column-gap: 5px;
    -webkit-column-count: 2;
    -webkit-column-gap: 5px;
    column-count: 2;
    column-gap: 5px;
    padding-left: 16px;
}

/* Remove fixed dimensions so layout adapts to browser size */
body {
    display: block;
    font-family: sans-serif;
    padding: 8px;
}

.title {
    font-size: 20px;
    font-weight: 600;
    margin: 8px 0;
}

.container {
    padding: 8px;
}

.item {
    margin-bottom: 8px;
}

.item-title {
    font-weight: 600;
    font-size: 14px;
}

.item-meta {
    font-size: 12px;
    color: #444;
}

a.item-link {
    color: #111;
    text-decoration: none;
}

a.item-link:hover {
    text-decoration: underline;
}

</style>
</head>
<body class="cl_body">
   <div class="container">
        <div class="title">Hacker News</div>

        <div th:if="${#lists.isEmpty(items)}">
            -- Hacker News está vacío --
        </div>

        <ol>
            <!-- Itera la lista items. Cada item es un JsonObject; usamos los getters de JsonObject -->
            <li th:each="item : ${items}">
                <div class="item">
                    <!-- Use the JsonObject keys produced by HNData (name, url, commentsCounter, commentsUrl, tags, date, times) -->
                    <div class="item-title">
                        <a th:if="${item.getString('url') != null}" th:href="${item.getString('url')}" th:text="${item.getString('name')}" class="item-link">Title</a>
                        <span th:if="${item.getString('url') == null}" th:text="${item.getString('name')}">Title</span>
                    </div>
                    <div class="item-meta">
                        <span th:if="${item.getInteger('commentsCounter') != null}" th:text="${item.getInteger('commentsCounter')} + ' comments'">0 comments</span>
                        <span th:if="${item.getString('commentsUrl') != null}"> — <a th:href="${item.getString('commentsUrl')}" th:text="${item.getString('commentsUrl')}">comments</a></span>
                    </div>
                </div>
            </li>
        </ol>
    </div>
</body>
</html>
